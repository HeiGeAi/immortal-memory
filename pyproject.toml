[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immortal-memory"
version = "0.1.0"
description = "Local-first personal memory layer for AI agents"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Immortal Memory Contributors"}]

[project.scripts]
immortal-memory = "immortal_memory.cli:main"

[tool.setuptools]
packages = ["immortal_memory"]
include-package-data = true

[tool.setuptools.package-dir]
immortal_memory = "core"

[tool.setuptools.package-data]
immortal_memory = ["*.json", "*.md", "agents/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
